<style>
    .contact-banner {
    /* Remplace 'ton-image.jpg' par le nom de ton fichier image */
    background-image: url('image/img12.png'); 
    
    background-size: cover;      /* L'image couvre toute la zone */
    background-position: center; /* L'image est centrée */
    background-repeat: no-repeat;
    
    /* Hauteur minimale pour laisser de la place au titre et aux cartes */
    min-height: 500px; 
    
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
    padding-top: 80px; /* Espace pour le titre "Contactez-nous" */
    position: relative;
}

.banner-title {
    font-size: 48px;
    font-weight: 800;
    color: #000000; /* Le titre est noir sur la maquette */
    margin-bottom: 50px;
    z-index: 2;
    
}
</style>
